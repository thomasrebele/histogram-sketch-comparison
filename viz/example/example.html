<!DOCTYPE html>
<html lang="en">
  <head>
    <title>visualizer</title>

    <!-- D3 using -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-timer.v1.min.js"></script>
    <script src="https://d3js.org/d3-queue.v3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.19/topojson.min.js"></script>
  </head>

  <body>
    <header id="header">
      <h1>visualizer</h1>
    </header>
    <main id="main">
      <div id="chart" class="graph"></div>
    </main>
    <script>
      const container = document.getElementById("chart");
      const width = 800; // container.clientWidth;
      const height = 1200; // container.clientHeight;

      const svg = d3.select(container).append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", "translate(50,50)");

      const data = [
        d3.csv("sog.csv"),
        d3.csv("sog2.csv"),
      ];
      Promise.all(data).then(csv_data => {
        console.log("CSVs loaded");

        // axis
        xmin = d3.min(csv_data, f=> d3.min(f, d=>d.x))
        xmax = d3.min(csv_data, f=> d3.max(f, d=>d.x))
        ymin = d3.min(csv_data, f=> d3.min(f, d=>d.y))
        ymax = d3.min(csv_data, f=> d3.max(f, d=>d.y))

        const xScale = d3.scaleLinear().domain([xmin, xmax]).nice().range([0, 400]);
        const yScale = d3.scaleLinear().domain([ymin, ymax]).nice().range([400, 0]);
        const xAxis = d3.axisBottom(xScale);
        const yAxis = d3.axisLeft(yScale);
        svg.append("g").attr("class", "x-axis").attr("transform", "translate(0, 400)").call(xAxis);
        svg.append("g").attr("class", "y-axis").call(yAxis);

        // legend
        var legend = svg.selectAll(".legend")
          .data([{desc: "test1", color:"#00ff00"}, {desc:"test2", color:"#ff0000"}])
          .enter().append("g")
            .attr("class", "legend")
            .attr("transform", function(d, i) { return "translate(0," + i * 20 + ")"; });

        legend.append("rect")
          .attr("x", 0)
          .attr("width", 18)
          .attr("height", 18)
          .style("fill", d=>d.color);

        legend.append("text")
          .attr("x", 0)
          .attr("y", 9)
          .attr("dy", ".35em")
          .style("text-anchor", "end")
          .text(function(d) { return d.desc; });

        // graphs
        for (const sog_data of csv_data) {
          const line = svg.append("g").append("path").datum(sog_data)
            .attr("d", d3.line().x(d => xScale(d.x)) .y(d => yScale(d.y)))
            .attr("stroke", "steelblue")
            .style("stroke-width", 1.5)
            .style("fill", "none");

          svg.selectAll("point").data(sog_data).enter().append("circle")
            .attr("class", "point")
            .attr("r", 2)
            .attr("cx", d => xScale(d.x))
            .attr("cy", d => yScale(d.y));
        }
      }).catch(err => {
        console.error("Error loading files:", err);
      })

    </script>
  </body>
</html>
