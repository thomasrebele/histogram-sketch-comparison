<!DOCTYPE html>
<html lang="en">
  <head>
    <title>visualizer</title>

    <!-- D3 using -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-timer.v1.min.js"></script>
    <script src="https://d3js.org/d3-queue.v3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.19/topojson.min.js"></script>
  </head>

  <body>
    <header id="header">
      <h1>visualizer</h1>
    </header>
    <main id="main">
      <div id="chart" class="graph"></div>
    </main>
    <script>
      // parse parameters
      const url = new URL(window.location.href);
      const params = new URLSearchParams(url.search);
      
      const toc = params.get('toc');
      
      console.log(`toc: ${toc}`);

      // setup diagram
      const container = document.getElementById("chart");
      const width = 1000; // container.clientWidth;
      const height = 800; // container.clientHeight;

      const svg = d3.select(container).append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", "translate(50,50)");

      const legendContainer = svg.append("g").attr("transform", "translate(200,0)");

      // load data
      var basePath = "/";
      if(toc.lastIndexOf("/") >= 0) {
        basePath = "/" + toc.substr(0,toc.lastIndexOf("/")+1);
      }

      console.log("basePath", basePath);
      console.log("toc", toc);

      d3.dsv("\t", "/" + toc).then(function(toc) {
        // add line identifier
        var lineIdx = 0;
        for (line of toc) {
          line.id = "line" + lineIdx;
          lineIdx += 1;
        }

        console.log(toc);
        const data = toc.map(el => d3.csv(basePath+el.file, d => {return {x:+d.x, y:+d.y}}));
        Promise.all(data).then(csv_data => {
          // add line identifier
          var lineIdx = 0;
          for (line of csv_data) {
            line.id = "line" + lineIdx;
            lineIdx += 1;
          }

          console.log("CSVs loaded");
          console.log(csv_data);

          // plotting
          var myColor = () => d3.scaleOrdinal().domain(data)
            .range(["blue", "green", "yellow", "grey", "darkgreen", "pink", "brown", "slateblue", "grey1", "orange"])
          // axis
          xmin = d3.min(csv_data, f=> d3.min(f, d=>d.x))
          xmax = d3.max(csv_data, f=> d3.max(f, d=>d.x))
          ymin = d3.min(csv_data, f=> d3.min(f, d=>d.y))
          ymax = d3.max(csv_data, f=> d3.max(f, d=>d.y))
          console.log(xmin, xmax, xmin<xmax);
          console.log(ymin, ymax, ymin<ymax);

          const xScale = d3.scaleLinear().domain([xmin, xmax]).nice().range([0, width]);
          const yScale = d3.scaleLinear().domain([ymin, ymax]).nice().range([height, 0]);
          console.log("being nice ...");
          const xAxis = d3.axisBottom(xScale);
          const yAxis = d3.axisLeft(yScale);
          const gxAxis = svg.append("g").attr("class", "x-axis").attr("transform", "translate(0, 680)").call(xAxis);
          const gyAxis = svg.append("g").attr("class", "y-axis").call(yAxis);

          // legend
          var legend = legendContainer.selectAll(".legend")
            .data(toc)
            .enter().append("g")
              .attr("class", (d, i) => "legend line" + i)
              .attr("transform", (d,i) => "translate(0," + i * 20 + ")")
              .on("mouseover", (ev,d) => {
                console.log("mouseover", ev, d);
                svg.selectAll("." + d.id + " path").style("stroke-width", "10");
              })
              .on("mouseout", (ev, d) => {
                console.log("mouseout", ev, d);
                svg.selectAll("." + d.id + " path").style("stroke-width", "2.5");
              });
          ;

          legend.append("rect").attr("x", 0).attr("width", 18).attr("height", 18).style("fill", myColor());
          legend.append("text").attr("x", 0).attr("y", 9).attr("dy", ".35em").style("text-anchor", "end")
            .text(function(d) { return d.desc; });

          // plot
          var lineColor = myColor()
          const series = svg.selectAll(".series").data(csv_data).join("g")
            .attr("class", (d,i) => "series line" + i)
            .attr("clip-path", "url(#clip)")
            .attr("stroke", lineColor)
            .attr("fill", lineColor)
          ;
          const lines = series.append("path").attr("class", "line")
            .attr("stroke-width", 2.5).style("fill", "none")
            .attr("d", d3.line().x(d => xScale(d.x)) .y(d => yScale(d.y)));
          const points = series.selectAll(".point").data(d=>d).join("circle").attr("class", "point").attr("r", 2)
            .attr("cx", d=>xScale(d.x)).attr("cy", d=>yScale(d.y));

          // zooming, sometimes only works when clicking within a region surrounded by plot lines
          const zoom = d3.zoom().scaleExtent([0.05, 200]).extent([[0, 0], [width, height]]).on("zoom", zoomed);
          svg.attr("pointer-events", "all").call(zoom);

          function zoomed(event) {
            // new scales
            const newX = event.transform.rescaleX(xScale);
            const newY = event.transform.rescaleY(yScale);

            // update axes
            gxAxis.call(xAxis.scale(newX));
            gyAxis.call(yAxis.scale(newY));

            // update the lines and the circles
            svg.selectAll(".line").attr("d", d3.line().x(d=>newX(d.x)).y(d=>newY(d.y)));
            svg.selectAll(".point").attr("cx", d=>newX(d.x)).attr("cy", d=>newY(d.y));
          }

        }).catch(err => {
          console.error("Error loading files:", err);
        })

      });
      
    </script>
  </body>
</html>
